# 고객 API 및 FastAPI 내부 API 수신 역할. 이메일 전송은 worker 컨테이너만 수행한다.
spring.main.web-application-type=servlet
email.queue.enabled=false
# API 컨테이너는 Redis queue·SMTP를 사용하지 않는다. 이 선택적 의존성의 연결 실패가
# ALB readiness를 DOWN으로 만들지 않도록 API 역할에서만 health contributor를 끈다.
management.health.mail.enabled=false
management.health.redis.enabled=false
