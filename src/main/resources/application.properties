spring.application.name=backend-spring
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

internal.auth.service-key=${INTERNAL_SERVICE_KEY:local-development-only-key}

# B안 전환 중: SQS adapter가 사용할 큐 이름. Spring은 발송 상태 DB를 소유하지 않는다.
email.queue.request-url=${EMAIL_REQUEST_QUEUE_URL:}
email.queue.result-url=${EMAIL_RESULT_QUEUE_URL:}
email.queue.enabled=${EMAIL_QUEUE_ENABLED:false}
email.queue.backend=${EMAIL_QUEUE_BACKEND:redis}
aws.region=${AWS_REGION:ap-northeast-2}
email.queue.visibility-timeout-seconds=${EMAIL_SQS_VISIBILITY_TIMEOUT_SECONDS:60}
email.queue.wait-time-seconds=${EMAIL_SQS_WAIT_SECONDS:20}

# 로컬 이메일 확인용 Mailpit SMTP. 운영에서는 sender를 ses로 교체한다.
email.sender=${EMAIL_SENDER:mailpit}
spring.mail.host=${MAILPIT_SMTP_HOST:localhost}
spring.mail.port=${MAILPIT_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
email.from=${EMAIL_FROM:no-reply@local.test}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/2}
email.queue.request-key=${EMAIL_REQUEST_QUEUE_KEY:email:delivery:requests}
email.queue.result-key=${EMAIL_RESULT_QUEUE_KEY:email:delivery:results}
email.queue.poll-delay-ms=${EMAIL_QUEUE_POLL_DELAY_MS:1000}

# 레거시 HTTP 호환 API 테스트용. DB 제거 단계에서 함께 삭제한다.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=email_service
spring.flyway.default-schema=email_service
spring.flyway.create-schemas=true

# B안 기본 실행: Spring은 DB 없이 큐 소비·메일 발송만 담당한다.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
